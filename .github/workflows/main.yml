# .github/workflows/ibkr-cron.yml
name: IBKR morning sync
on:
  schedule:
    # 06:00 UK local. GitHub cron is fixed-UTC with no DST handling, so this
    # is 05:00 UTC to hit 6am while the UK is on BST (UTC+1). In winter (GMT)
    # this fires at 05:00 UK - bump to "0 6 * * *" if you want 6am year-round.
    - cron: "0 5 * * *"
  workflow_dispatch:   # lets you manually fire it from the Actions tab
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoint
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://cuequill.com/api/ibkr/cron
