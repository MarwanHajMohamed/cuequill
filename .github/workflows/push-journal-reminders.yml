name: Push journal reminders (manual)

# The hourly schedule is owned by Upstash QStash, which hits
# https://www.cuequill.com/api/cron/push-journal-reminders every hour; the
# endpoint filters to opted-in users whose local time is in the send hour,
# so one hourly fire covers every timezone.
#
# This workflow is for manual smoke tests only. Trigger it from the Actions
# tab; add ?email=you@example.com on the URL below to send yourself one now.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/push-journal-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is empty. Set it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          resp=$(curl -sS -L -w $'\n%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.cuequill.com/api/cron/push-journal-reminders)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "::error::push-journal-reminders returned HTTP $code"
            exit 1
          fi
